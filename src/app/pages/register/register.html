<div class="register-page">

  <div class="register-card">

    <!-- LOGO -->
    <div class="logo">
      🍃
    </div>

    <!-- BRAND -->
    <div class="brand">
      <span>Eco</span>Track
    </div>

    <div class="tagline">
      Track • Reduce • Sustain
    </div>

    <!-- TITLE -->
    <h1>Create User Account</h1>

    <p class="subtitle">
      Join EcoTrack and start your sustainability journey.
    </p>

    <!-- FULL NAME -->
    <div class="form-row">

      <label>Full Name</label>

      <input
        [(ngModel)]="name"
        type="text"
        placeholder="Enter your full name"
      >

    </div>

    <!-- EMAIL -->
    <div class="form-row">

      <label>Email</label>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
      >

    </div>

    <!-- PASSWORD -->
    <div class="form-row">

      <label>Password</label>

      <div class="password-box">

        <input
        id="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Create password"
        >

        <button
          type="button"
          (click)="togglePassword()"
        >
          {{ showPassword ? '🙈' : '👁' }}
        </button>

      </div>

    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="form-row">

      <label>Confirm Password</label>

      <div class="password-box">

        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm password"
        >

        <button
          type="button"
          (click)="toggleConfirmPassword()"
        >
          {{ showConfirmPassword ? '🙈' : '👁' }}
        </button>

      </div>

    </div>

    <!-- CREATE ACCOUNT -->
    <button
      type="button"
      class="create-button"
      (click)="register()"
    >
      Create Account
    </button>

    <!-- OR -->
    <div class="divider">

      <span></span>

      <strong>OR</strong>

      <span></span>

    </div>

    <!-- GOOGLE -->
<button
      type="button"
      class="google-btn">

      <span class="google-icon">G</span>
      Continue with Google

    </button>
    <!-- LOGIN -->
     <p class="login">
      Don't have an account?

      <a routerLink="/login">
           Login
      </a>
    </p>

  </div>

</div>
