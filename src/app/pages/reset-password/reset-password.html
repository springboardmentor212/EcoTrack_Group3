<div class="reset-container">
    <div class="reset-card">
       <!-- LOGO -->
    <div class="logo">
      🍃
    </div>

    <!-- BRAND -->
    <div class="brand">
      <span>Eco</span>Track
    </div>

    <div class="tagline">
      Track • Reduce • Sustain
    </div>
    <!-- Titles-->
        <h2>Reset Password</h2>
        <p class="subtitle">Create a new password for your account.</p>
        <form (ngSubmit)="resetPassword()">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                type="password"
                id="newPassword"
                name="newPassword"
                [(ngModel)]="newPassword"
                placehoder="Enter new password" required />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                [(ngModel)]="confirmPassword"
                placehoder="Confirm new password" required />
            </div>
            @if (errorMessage) {
                <p class="error">{{errorMessage}}</p>
            }
            <button type="submit" class="reset-btn">
                Reset Password
            </button>
        </form>
        <p class="login-text">
            Remember your password?
            <button type="button" class="login-link" (click)="goToLogin()">
                Back To Login
            </button>
        </p>
    </div>

</div>
