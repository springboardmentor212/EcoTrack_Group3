<div class="profile-page">

  <div class="profile-header">

    <h1>My Profile</h1>

    <p>
      Manage your EcoTrack profile
    </p>

  </div>


  <div class="profile-card">

    <div class="profile-avatar">
      👤
    </div>


    <div class="profile-info">

      <h2>
        {{ userName }}
      </h2>

      <p>
        {{ userEmail }}
      </p>

    </div>

  </div>


  <div class="profile-details">


    <!-- ECO POINTS -->

    <div class="detail-card">

      <span>🌱</span>

      <div>

        <h3>
          Eco Points
        </h3>

        <p>
          {{ ecoPoints }} Points
        </p>

      </div>

    </div>


    <!-- CURRENT STREAK -->

    <div class="detail-card">

      <span>🔥</span>

      <div>

        <h3>
          Current Streak
        </h3>

        <p>
          {{ currentStreak }} Days
        </p>

      </div>

    </div>


    <!-- CHALLENGES -->

    <div class="detail-card">

      <span>🏆</span>

      <div>

        <h3>
          Challenges Completed
        </h3>

        <p>
          {{ challengesCompleted }}
          Challenges
        </p>

      </div>

    </div>


  </div>

</div>
