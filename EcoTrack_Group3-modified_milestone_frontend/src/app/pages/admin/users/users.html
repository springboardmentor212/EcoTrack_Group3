<div class="admin-users">
  <h1>Users</h1>

  <div class="users-table" *ngIf="users.length > 0">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Created At</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.createdAt | date }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="users.length === 0">
    No users found.
  </p>
</div>
