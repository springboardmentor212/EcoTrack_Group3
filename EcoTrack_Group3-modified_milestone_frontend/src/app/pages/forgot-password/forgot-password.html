<div class="page">

  <div class="forgot-card">

    <div class="logo-icon">🌿</div>

    <h1 class="logo-title">
      <span>Eco</span>Track
    </h1>

    <p class="tagline">Track • Reduce • Sustain</p>

    <div class="icon">🔐</div>

    <h2>Forgot Password?</h2>

    <p class="subtitle">
      No worries! Enter your email address and we'll help you reset your password.
    </p>

    <div class="form-group">

      <label for="email">
        Email Address
      </label>

      <input
        #emailInput
        id="email"
        type="email"
        placeholder="Enter your email"
      />

    </div>

    <button
      type="button"
      class="reset-btn"
      (click)="resetPassword(emailInput.value)">

      Send Reset Link

    </button>

    <p class="back-login">

      <a routerLink="/">
        ← Back to Login
      </a>

    </p>

  </div>

</div>
